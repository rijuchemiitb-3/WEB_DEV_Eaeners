<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <h2 style="text-align: center">Novell Services Login</h2>
        <form action="welcomepage.html" target="_blank">
            <fieldset>
                <table>
                    <tr>
                        <td><label for="username">Username : </label></td>
                        <td><input type="text" id="username" placeholder="Enter Your Name" required></td>
                    </tr>
                    <tr>
                        <td><label for="password">Password : </label></td>
                        <td><input type="password" id="password" placeholder="Enter Your Password" required></td>
                    </tr>
                    <tr>
                        <td><label for="city">City of Employment : </label></td>
                        <td> <input type="text" id="city" placeholder="Enter City Name" required></td>
                    </tr>
                    <tr>
                        <td><label for="server">Web Server : </label></td>
                        <td>
                            <select name="server" id="server">
                                <option value="">Choose a Server--</option>
                                <option value="microsoft IIS">Microsoft IIS</option>
                                <option value="lightspeed">Lightspeed</option>
                                <option value="caddy">Caddy</option>
                                <option value="lighttpd">Lighttpd</option>
                            </select>
                        </td>
                    </tr>
                </table>
                <br>
                <table>
                    <tr>
                        <td>Please specify your role :</td>
                        <td>
                            <label for="role"></label>
                            <input type="radio" id="arole" name="role">
                            <label for="arole">Admin </label><br>
                            <input type="radio" id="erole" name="role">
                            <label for="erole">Engineer </label><br>
                            <input type="radio" id="mrole" name="role">
                            <label for="mrole">Manager </label><br>
                            <input type="radio" id="grole" name="role">
                            <label for="grole">Guest </label>
                        </td>
                    </tr>
                    <tr>
                        <td>Single sign-on to the following : </td>
                        <td>
                            <label for="sign-on" class="left"></label>
                            <input type="checkbox" id="mail" name="sign-on">
                            <label for="mail">Mail </label><br>
                            <input type="checkbox" id="payroll" name="sign-on">
                            <label for="payroll">Payroll </label><br>
                            <input type="checkbox" id="selfservice" name="sign-on">
                            <label for="selfservice">Self-service </label>
                        </td>
                    </tr>
                </table>

            </fieldset>
            <br>
            <button type="submit"> Login</button>
            <button type="reset"> Reset</button>
        </form>

    </div>

</html>
